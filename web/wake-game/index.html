<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>暫時冇錢課金:(</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
      background: #f7f4fb;
      color: #111;
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
    }
    .card {
      width: min(420px, 100%);
      padding: 16px;
      border: 2px solid #111;
      border-radius: 16px;
      background: #fff;
    }
    h1 { margin: 0 0 6px; font-size: 1.25rem; }
    p { margin: 0 0 10px; line-height: 1.45; }
    .help { font-size: 0.9rem; }
    canvas {
      width: 100%; height: auto; display: block;
      background: #fff; image-rendering: pixelated;
    }
    .pad {
      display: grid; grid-template-columns: 44px 44px 44px;
      gap: 6px; width: max-content; margin: 8px auto 0;
    }
    .pad button {
      width: 44px; height: 44px; border-radius: 10px;
      border: 2px solid #111; background: #fff; color: #111; font-size: 1.1rem;
    }
    .pad button[data-dir="u"] { grid-column: 2; grid-row: 1; }
    .pad button[data-dir="l"] { grid-column: 1; grid-row: 2; }
    .pad button[data-dir="d"] { grid-column: 2; grid-row: 2; }
    .pad button[data-dir="r"] { grid-column: 3; grid-row: 2; }
    .swipe { display: none; }
    .toggle {
      display: block; margin: 0 0 8px auto;
      padding: 2px 10px; border: 1px solid #111; border-radius: 999px;
      background: #fff; color: #111; font-size: 0.75rem;
    }
    .card.is-hidden canvas, .card.is-hidden .score, .card.is-hidden .pad { display: none; }
    canvas { touch-action: none; }
    a { color: #111; }
    @media (max-width: 1023px), ((hover: none) and (pointer: coarse)) {
      .keys, .pad { display: none; }
      .swipe { display: block; }
      .card.is-hidden .swipe { display: none; }
    }
  </style>
</head>
<body>
  <main class="card" id="wake-note">
    <h1>暫時冇錢課金:(</h1>
    <p>這頁可以隨時玩，不用等伺服器。</p>
    <p class="keys">方向鍵移動，去食黑點。</p>
    <p class="swipe">在遊戲上滑動，去食黑點。</p>
    <button type="button" class="toggle" id="toggle">收起遊戲</button>
    <canvas id="wake-game" width="192" height="112" aria-label="方向鍵移動，去食黑點。"></canvas>
    <p class="help score">分數在左上角。</p>
    <div class="pad">
      <button type="button" data-dir="u" aria-label="上">↑</button>
      <button type="button" data-dir="l" aria-label="左">←</button>
      <button type="button" data-dir="d" aria-label="下">↓</button>
      <button type="button" data-dir="r" aria-label="右">→</button>
    </div>
    <p class="help"><a href="../">返回登入</a></p>
  </main>
  <script>
    const root = document.getElementById('wake-note');
    const canvas = document.getElementById('wake-game');
    const ctx = canvas.getContext('2d');
    const cols = 12;
    const rows = 7;
    const cell = 16;
    canvas.width = cols * cell;
    canvas.height = rows * cell;
    let x = 1;
    let y = 3;
    let score = 0;
    const dots = [];
    const placeDot = () => {
      dots.push({
        x: 1 + Math.floor(Math.random() * (cols - 2)),
        y: 1 + Math.floor(Math.random() * (rows - 2)),
      });
    };
    placeDot();
    placeDot();
    placeDot();
    const step = (dx, dy) => {
      x = Math.max(0, Math.min(cols - 1, x + dx));
      y = Math.max(0, Math.min(rows - 1, y + dy));
      for (let i = dots.length - 1; i >= 0; i -= 1) {
        if (dots[i].x === x && dots[i].y === y) {
          dots.splice(i, 1);
          score += 1;
          placeDot();
        }
      }
    };
    let held = null;
    window.addEventListener('keydown', (event) => {
      const tag = event.target && event.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
      const map = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
      if (!map[event.key]) return;
      event.preventDefault();
      held = map[event.key];
      if (event.repeat) return;
      step(held[0], held[1]);
    });
    window.addEventListener('keyup', (event) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) held = null;
    });
    root.querySelectorAll('[data-dir]').forEach((btn) => {
      btn.addEventListener('click', (event) => {
        event.preventDefault();
        const map = { u: [0, -1], d: [0, 1], l: [-1, 0], r: [1, 0] };
        const dir = map[btn.getAttribute('data-dir')];
        if (dir) step(dir[0], dir[1]);
      });
    });
    const touchQuery = window.matchMedia('(max-width: 1023px), (hover: none) and (pointer: coarse)');
    let touchStart = null;
    canvas.addEventListener('touchstart', (event) => {
      if (!touchQuery.matches || event.touches.length !== 1) return;
      touchStart = { x: event.touches[0].clientX, y: event.touches[0].clientY };
    }, { passive: true });
    canvas.addEventListener('touchmove', (event) => {
      if (touchStart) event.preventDefault();
    }, { passive: false });
    canvas.addEventListener('touchend', (event) => {
      if (!touchStart) return;
      const point = event.changedTouches[0];
      const dx = point.clientX - touchStart.x;
      const dy = point.clientY - touchStart.y;
      touchStart = null;
      if (Math.hypot(dx, dy) < 24) return;
      if (Math.abs(dx) >= Math.abs(dy)) step(dx > 0 ? 1 : -1, 0);
      else step(0, dy > 0 ? 1 : -1);
    });
    const toggle = document.getElementById('toggle');
    const paintToggle = () => {
      const hidden = root.classList.contains('is-hidden');
      toggle.textContent = hidden ? '顯示遊戲' : '收起遊戲';
      toggle.setAttribute('aria-pressed', hidden ? 'true' : 'false');
    };
    try {
      const _hide = (() => { try { let v = localStorage.getItem('td-hide-wake-game'); if (v == null) { v = localStorage.getItem('mkpc-hide-wake-game'); if (v != null) localStorage.setItem('td-hide-wake-game', v); } return v; } catch { return null; } })();
      if (_hide === '1') root.classList.add('is-hidden');
    } catch (err) { /* leave the game visible */ }
    paintToggle();
    toggle.addEventListener('click', () => {
      root.classList.toggle('is-hidden');
      try { localStorage.setItem('td-hide-wake-game', root.classList.contains('is-hidden') ? '1' : '0'); }
      catch (err) { /* keep the choice for this view */ }
      paintToggle();
    });
    let acc = 0;
    let last = performance.now();
    const frame = (now) => {
      if (held) {
        acc += now - last;
        if (acc > 140) {
          acc = 0;
          step(held[0], held[1]);
        }
      }
      last = now;
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 2;
      ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);
      ctx.fillStyle = '#111';
      dots.forEach((dot) => ctx.fillRect(dot.x * cell + 5, dot.y * cell + 5, 6, 6));
      ctx.fillRect(x * cell + 2, y * cell + 2, cell - 4, cell - 4);
      ctx.font = '12px sans-serif';
      ctx.fillText(String(score), 6, 14);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  </script>
</body>
</html>
